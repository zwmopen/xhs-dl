[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xhs-dl"
version = "2.5.0"
description = "小红书抖音下载 - 本地小红书与抖音原始媒体下载器"
readme = "README.md"
requires-python = ">=3.7"
dependencies = ["requests>=2.28.0", "customtkinter>=5.2.2", "playwright>=1.55.0", "Pillow>=10.0"]
license = {text = "MIT"}

[project.scripts]
xhs-dl = "xhs_dl.cli:main"
xhs-dl-web = "xhs_dl.web.app:main"
xhs-dl-desktop = "xhs_dl.desktop.app:main"

[tool.setuptools.packages.find]
include = ["xhs_dl*"]
